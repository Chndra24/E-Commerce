name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    env:
      # Placeholder values: no step in this workflow connects to a real database
      # yet. Real secrets live in Vercel / GitHub Environments, never in git.
      AUTH_SECRET: ci-placeholder-not-used-at-runtime
      AUTH_TRUST_HOST: "true"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/segmenta
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/segmenta

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: segmenta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci # postinstall runs `prisma generate`

      # Proves the committed migrations apply cleanly to an empty database.
      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
